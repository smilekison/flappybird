<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#231F20">
    <title>FlappyProject — Flappy Bird</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main class="webgl-content">
      <div id="gameContainer" aria-label="Flappy Bird game"></div>
      <p id="gameLoadError" class="game-load-error" role="alert" hidden>
        The game could not be loaded. Please refresh the page or try a browser with WebGL support.
      </p>
      <footer class="footer">
        <div class="webgl-logo" aria-hidden="true"></div>
        <button class="fullscreen" type="button" aria-label="Enter fullscreen" onclick="flappyToggleFullscreen()"></button>
        <a class="download-link" href="Android%20File/flappybird.apk" download>Download Android app</a>
        <div class="title">FlappyProject</div>
      </footer>
    </main>

    <script>
      (function () {
        "use strict";

        var gameInstance = null;
        var gameContainer = document.getElementById("gameContainer");
        var gameCanvas = null;

        function showLoadError() {
          var error = document.getElementById("gameLoadError");
          if (error) error.hidden = false;
        }

        function focusGameCanvas() {
          if (!gameCanvas) gameCanvas = gameContainer.querySelector("canvas");
          if (gameCanvas) {
            gameCanvas.tabIndex = 0;
            gameCanvas.style.pointerEvents = "auto";
            try {
              gameCanvas.focus({ preventScroll: true });
            } catch (_) {
              gameCanvas.focus();
            }
          }
        }

        // Unity creates its canvas asynchronously. Make it focusable so keyboard
        // input works after the player clicks/taps the game.
        var canvasObserver = new MutationObserver(function () {
          var canvas = gameContainer.querySelector("canvas");
          if (!canvas) return;
          if (canvas !== gameCanvas) {
            gameCanvas = canvas;
            gameCanvas.tabIndex = 0;
            gameCanvas.setAttribute("aria-label", "Flappy Bird game. Click or press Space to flap.");
            gameCanvas.addEventListener("pointerdown", function () {
              focusGameCanvas();
            });
            gameCanvas.addEventListener("click", function () {
              focusGameCanvas();
            });
          }
        });
        canvasObserver.observe(gameContainer, { childList: true, subtree: true });

        // Space should flap instead of scrolling the page while the game is active.
        // Do not block the event: Unity still needs to receive the keyboard input.
        window.addEventListener("keydown", function (event) {
          if (event.code !== "Space" && event.key !== " ") return;
          var target = event.target;
          if (target && /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(target.tagName)) return;
          if (gameCanvas) event.preventDefault();
        }, { passive: false });

        window.addEventListener("error", function (event) {
          if (event && event.target && event.target.tagName === "SCRIPT") showLoadError();
        }, true);

        window.flappyToggleFullscreen = function () {
          if (!gameInstance || typeof gameInstance.SetFullscreen !== "function") {
            showLoadError();
            return;
          }
          gameInstance.SetFullscreen(1);
        };

        window.addEventListener("orientationchange", function () {
          if (gameInstance && gameInstance.Module &&
              typeof gameInstance.Module.setCanvasSize === "function") {
            gameInstance.Module.setCanvasSize(0, 0);
          }
        });

        function startGame() {
          if (!window.UnityLoader || typeof window.UnityLoader.instantiate !== "function") {
            showLoadError();
            console.error("UnityLoader failed to load. Check Build/UnityLoader.js.");
            return;
          }
          if (typeof window.UnityProgress !== "function") {
            showLoadError();
            console.error("UnityProgress failed to load. Check TemplateData/UnityProgress.js.");
            return;
          }

          try {
            gameInstance = window.UnityLoader.instantiate(
              "gameContainer",
              "Build/New folder.json",
              { onProgress: window.UnityProgress }
            );
            window.flappyGameInstance = gameInstance;
          } catch (error) {
            showLoadError();
            console.error("Unable to initialize FlappyProject.", error);
          }
        }

        var progressScript = document.createElement("script");
        progressScript.src = "TemplateData/UnityProgress.js";
        progressScript.onload = function () {
          var loaderScript = document.createElement("script");
          loaderScript.src = "Build/UnityLoader.js";
          loaderScript.onload = startGame;
          loaderScript.onerror = showLoadError;
          document.body.appendChild(loaderScript);
        };
        progressScript.onerror = showLoadError;
        document.body.appendChild(progressScript);
      }());
    </script>
  </body>
</html>
