<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#231F20">
    <title>FlappyProject — Flappy Bird</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main class="webgl-content">
      <div id="gameContainer" aria-label="Flappy Bird game"></div>
      <p id="gameLoadError" class="game-load-error" role="alert" hidden>
        The game could not be loaded. Please refresh the page or try a browser with WebGL support.
      </p>
      <footer class="footer">
        <div class="webgl-logo" aria-hidden="true"></div>
        <button class="fullscreen" type="button" aria-label="Enter fullscreen" onclick="flappyToggleFullscreen()"></button>
        <a class="download-link" href="Android%20File/flappybird.apk" download>Download Android app</a>
        <div class="title">FlappyProject</div>
      </footer>
    </main>

    <!-- Keep Unity's legacy loader after the game container exists in the DOM. -->
    <script>
      (function () {
        "use strict";

        var gameInstance = null;

        function showLoadError() {
          var error = document.getElementById("gameLoadError");
          if (error) error.hidden = false;
        }

        window.addEventListener("error", function (event) {
          if (event && event.target && event.target.tagName === "SCRIPT") {
            showLoadError();
          }
        }, true);

        window.flappyToggleFullscreen = function () {
          if (!gameInstance || typeof gameInstance.SetFullscreen !== "function") {
            showLoadError();
            return;
          }
          gameInstance.SetFullscreen(1);
        };

        window.addEventListener("orientationchange", function () {
          if (gameInstance && gameInstance.Module &&
              typeof gameInstance.Module.setCanvasSize === "function") {
            gameInstance.Module.setCanvasSize(0, 0);
          }
        });

        function startGame() {
          if (!window.UnityLoader || typeof window.UnityLoader.instantiate !== "function") {
            showLoadError();
            console.error("UnityLoader failed to load. Check Build/UnityLoader.js.");
            return;
          }
          if (typeof window.UnityProgress !== "function") {
            showLoadError();
            console.error("UnityProgress failed to load. Check TemplateData/UnityProgress.js.");
            return;
          }

          try {
            gameInstance = window.UnityLoader.instantiate(
              "gameContainer",
              "Build/New folder.json",
              { onProgress: window.UnityProgress }
            );
            window.flappyGameInstance = gameInstance;
          } catch (error) {
            showLoadError();
            console.error("Unable to initialize FlappyProject.", error);
          }
        }

        // Load these classic scripts only after #gameContainer has been created.
        var progressScript = document.createElement("script");
        progressScript.src = "TemplateData/UnityProgress.js";
        progressScript.onload = function () {
          var loaderScript = document.createElement("script");
          loaderScript.src = "Build/UnityLoader.js";
          loaderScript.onload = startGame;
          loaderScript.onerror = showLoadError;
          document.body.appendChild(loaderScript);
        };
        progressScript.onerror = showLoadError;
        document.body.appendChild(progressScript);
      }());
    </script>
  </body>
</html>
